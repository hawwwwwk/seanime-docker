name: Seanime Docker CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Unraid XML
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = ["ca_profile.xml", *glob.glob("templates/*.xml")]

          for filename in files:
              ET.parse(filename)
              print(f"Valid XML: {filename}")
          PY

      - name: Build Docker image
        run: |
          docker build -t seanime-ci:${{ github.sha }} .

      - name: Verify container tools
        run: |
          docker run --rm \
            --entrypoint sh \
            seanime-ci:${{ github.sha }} \
            -c 'ffmpeg -version >/dev/null &&
              ffprobe -version >/dev/null'

      - name: Verify PUID and PGID support
        run: |
          docker run --rm \
            -e PUID=99 \
            -e PGID=100 \
            seanime-ci:${{ github.sha }} \
            sh -c '
              test "$(id -u)" = "99" &&
              test "$(id -g)" = "100" &&
              touch /config/permission-test &&
              test "$(stat -c %u /config/permission-test)" = "99" &&
              test "$(stat -c %g /config/permission-test)" = "100"
            '
      - name: Verify anime ownership is untouched
        run: |
          docker volume create seanime-anime-ci

          docker run --rm \
            --entrypoint sh \
            -v seanime-anime-ci:/anime \
            seanime-ci:${{ github.sha }} \
            -c 'touch /anime/ownership-test &&
                chown 1234:1234 /anime/ownership-test'

          OWNER="$(docker run --rm \
            -e PUID=99 \
            -e PGID=100 \
            -v seanime-anime-ci:/anime \
            seanime-ci:${{ github.sha }} \
            sh -c 'stat -c "%u:%g" /anime/ownership-test')"

          echo "Anime test file ownership: $OWNER"

          if [ "$OWNER" != "1234:1234" ]; then
            echo "ERROR: /anime ownership was modified."
            exit 1
          fi

          docker volume rm seanime-anime-ci

      - name: Start Seanime
        run: |
          docker run -d \
            --name seanime-ci \
            -e PUID=99 \
            -e PGID=100 \
            -e SEANIME_SERVER_HOST=0.0.0.0 \
            -p 43211:43211 \
            seanime-ci:${{ github.sha }}

      - name: Verify Seanime runs non-root
        run: |
          UID_VALUE="$(docker exec seanime-ci sh -c "awk '/^Uid:/ {print \$2}' /proc/1/status")"
          GID_VALUE="$(docker exec seanime-ci sh -c "awk '/^Gid:/ {print \$2}' /proc/1/status")"

          echo "Seanime UID: $UID_VALUE"
          echo "Seanime GID: $GID_VALUE"

          test "$UID_VALUE" = "99"
          test "$GID_VALUE" = "100"

      - name: Wait for healthy container
        run: |
          for i in $(seq 1 60); do
            HEALTH="$(docker inspect --format='{{.State.Health.Status}}' seanime-ci 2>/dev/null || true)"

            echo "Seanime health status: ${HEALTH:-unknown}"

            case "$HEALTH" in
              healthy)
                echo "Seanime container is healthy!"
                exit 0
                ;;
              unhealthy)
                echo "Seanime container became unhealthy."
                docker inspect --format='{{json .State.Health}}' seanime-ci || true
                exit 1
                ;;
            esac

            sleep 2
          done

          echo "Seanime did not become healthy before timeout."
          docker inspect --format='{{json .State.Health}}' seanime-ci || true
          exit 1

      - name: Verify WebUI
        run: |
          if curl --fail --silent http://127.0.0.1:43211/ >/dev/null; then
            echo "Seanime WebUI is responding!"
          else
            echo "Seanime WebUI is not responding."
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: |
          docker logs seanime-ci || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f seanime-ci || true
          docker volume rm seanime-anime-ci || true